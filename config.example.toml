# yt-jp-redub settings. Copy to config.toml and edit; every key is optional.
# Secrets (the LLM API key) go in .env, not here.

[server]
host = "0.0.0.0"          # "127.0.0.1" limits access to this PC only
port = 8767               # 8765 is AnkiConnect's, 8766 asbplayer's
ws_port = 8766            # asbplayer WebSocket client connects here (PC only)
public_host = ""          # override the auto-discovered LAN IP used in links
unload_after_min = 5      # free the GPU this many minutes after the last video is dubbed; 0 keeps the
                          # models loaded (they load again, in the background, when a video starts)

[storage]
data_dir = "data"
cap_gb = 50               # least recently watched videos are deleted when over the cap

[download]
max_height = 1080
cookies_file = ""         # optional Netscape cookies.txt for yt-dlp

[asr]
model = "nemo-parakeet-tdt-0.6b-v2"
device = "cuda"           # "cuda" or "cpu"
use_vocals = false        # run ASR on Demucs vocals (better for music-heavy videos, slower start)

[segment]
max_line_chars = 120      # English characters per subtitle line
max_line_sec = 9.0
pause_split_sec = 0.5     # a pause this long ends a line
chunk_sec = 60            # target dub chunk length, split at silences
first_chunk_sec = 15      # the first chunks are shorter (doubling up to chunk_sec), so playback starts sooner

[translate]
backend = "openai"        # "openai" (any OpenAI-compatible API) or "mock"
batch_lines = 40
concurrency = 3           # batches translated in parallel (within the rpm limit)
context_lines = 16
rpm = 0                   # requests per minute; 0 = the provider's published limit (Google AI Studio free
                          # tier: 25, xAI: 2000), no limit for others (HTTP 429 answers are retried)
tpm = 0                   # tokens per minute (rough estimate on our side); 0 = as for rpm
max_retries = 20
temperature = 0.4
reasoning_effort = "none" # for thinking models: "none" answers 4-10x faster and translated as well in a
                          # blind comparison with "low"; "" leaves the model's default

[separate]
backend = "demucs"        # "demucs" or "mock"
model = "htdemucs"
device = "cuda"

[tts]
backend = "indextts"      # "indextts" or "mock"
indextts_dir = "third_party/index-tts"
lang = "JA"
max_speedup = 1.25        # lines are spoken up to this much faster to fit the original slot
max_slowdown = 1.2        # ...or this much slower, so speech fills the time the original took
group_speakers = true     # voice a speaker's consecutive sentences as one utterance (smoother)
speaker_sim = 0.6         # voice similarity needed to treat adjacent lines as the same speaker
group_gap_sec = 0.4
group_max_sec = 12
min_ref_sec = 3.0         # shorter reference audio is padded with neighbouring audio
use_bf16 = true
emo_alpha = 1.0
num_beams = 1             # IndexTTS search width: 1 is ~20% faster than 3 with the same intelligibility

[stream]
head_start_sec = 120      # playback starts once this much is dubbed, or sooner if the dub will keep ahead
lookahead_chunks = 3      # chunks after the playhead that always go first
hold_sec = 20             # how long a not-yet-dubbed segment request is held before 503
video_segment_sec = 6
