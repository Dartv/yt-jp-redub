[project]
name = "yt-jp-redub"
version = "0.1.0"
description = "Self-hosted tool that dubs YouTube videos into Japanese with emotion-preserving TTS, for Japanese learners."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiohttp>=3.10",
  "python-dotenv>=1.0",
  "numpy>=1.26,<2.3",
  "soundfile>=0.12",
  "onnx-asr[hub]>=0.7",
  "onnxruntime>=1.20; sys_platform == 'darwin'",
  "onnxruntime-gpu>=1.20,<1.24; sys_platform != 'darwin'",
  "demucs>=4.0.1",
  "torch==2.8.*",
  "torchaudio==2.8.*",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[project.scripts]
yt-jp-redub = "yt_jp_redub.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_jp_redub"]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
# RTX 50-series (Blackwell) needs CUDA 12.8+ builds.
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E741",    # `l` is the natural name for a subtitle line here
  "RUF001",  # Japanese punctuation in strings is intentional
  "RUF002",
  "RUF003",
  "B008",
]
