<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <title>yt-jp-redub</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>"
    />
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <h1>yt-jp-<b>redub</b></h1>
        <span>YouTube, dubbed into Japanese</span>
      </header>

      <form class="add" id="add">
        <input
          id="url"
          type="url"
          inputmode="url"
          placeholder="Paste a YouTube link"
          autocomplete="off"
          required
        />
        <button type="submit">Dub</button>
      </form>

      <div id="grid" class="grid"></div>

      <details class="help">
        <summary>Other ways to add videos</summary>
        <p>
          Bookmarklet: drag <a id="bm" class="bookmarklet" href="#">Dub this</a> to your bookmarks bar and
          click it on a YouTube video.
        </p>
        <p>Command line: <code>uv run yt-jp-redub add &lt;url&gt;</code></p>
        <p>Phone on the same Wi-Fi: open <code id="base"></code></p>
        <p>asbplayer on this PC: enable its WebSocket client with <code id="ws"></code></p>
      </details>
    </main>

    <script src="/static/library.js"></script>
  </body>
</html>
