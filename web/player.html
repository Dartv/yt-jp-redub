<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <title>Player · yt-jp-redub</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>"
    />
    <script src="/static/vendor/hls.min.js"></script>
  </head>
  <body class="player">
    <header class="player-top">
      <a href="/" aria-label="Library">‹</a>
      <a class="t yt" id="topTitle" target="_blank" rel="noopener" title="Open the original video"></a>
      <button class="dl" id="dl" hidden></button>
    </header>

    <div class="stage-wrap">
      <div class="stage controls-on" id="stage">
        <video id="video" playsinline preload="auto" crossorigin="anonymous"></video>

        <div class="subs" id="subs">
          <div class="ja" id="subJa" lang="ja" title="Tap to pause"></div>
          <div class="en" id="subEn" lang="en" title="Tap to pause"></div>
        </div>

        <div class="overlay" id="overlay">
          <div class="spinner" id="spin"></div>
          <div class="big" id="ovTitle">Preparing…</div>
          <div class="small" id="ovText"></div>
          <button class="play" id="ovPlay" hidden aria-label="Play">▶</button>
          <button class="retry" id="ovRetry" hidden>Retry</button>
        </div>

        <div class="skip-hint back" id="skipBack"></div>
        <div class="skip-hint fwd" id="skipFwd"></div>

        <div class="controls" id="controls">
          <div class="seek" id="seek">
            <div class="track">
              <div id="dubbed"></div>
              <div class="played" id="played"></div>
            </div>
            <div class="knob" id="knob"></div>
          </div>
          <div class="row">
            <button class="icon" id="playBtn" aria-label="Play/pause"></button>
            <span class="time" id="time">0:00 / 0:00</span>
            <span class="spacer"></span>
            <div class="pill" role="group" aria-label="Audio">
              <button id="audJa" class="on">日本語</button><button id="audEn">EN</button>
            </div>
            <button class="chip on" id="subBtnJa" aria-label="Japanese subtitles">字</button>
            <button class="chip" id="subBtnEn" aria-label="English subtitles">EN</button>
            <button class="icon" id="setBtn" aria-label="Settings" aria-haspopup="true"></button>
            <button class="icon" id="fsBtn" aria-label="Fullscreen"></button>
          </div>
          <div class="menu" id="menu" hidden>
            <div class="menu-label">Speed</div>
            <div class="pill" id="rates" role="group" aria-label="Playback speed">
              <button data-v="0.5">0.5</button><button data-v="0.75">0.75</button
              ><button data-v="1">1×</button><button data-v="1.25">1.25</button
              ><button data-v="1.5">1.5</button>
            </div>
            <div class="menu-label">Subtitle size</div>
            <div class="pill" id="sizes" role="group" aria-label="Subtitle size">
              <button data-v="0.8">S</button><button data-v="1">M</button><button data-v="1.25">L</button
              ><button data-v="1.5">XL</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <section class="below">
      <h2><a class="yt" id="title" target="_blank" rel="noopener" title="Open the original video"></a></h2>
      <div class="status" id="status"></div>
      <div class="actions"><button id="asbBtn" hidden>Send subtitles to asbplayer</button></div>
    </section>

    <script src="/static/download.js"></script>
    <script src="/static/player.js"></script>
  </body>
</html>
