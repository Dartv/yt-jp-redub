<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <title>Player · yt-jp-redub</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>"
    />
    <script src="/static/vendor/hls.min.js"></script>
  </head>
  <body class="player">
    <header class="player-top">
      <a href="/" aria-label="Library">‹</a>
      <a class="t yt" id="topTitle" target="_blank" rel="noopener" title="Open the original video"></a>
      <button class="dl" id="dl" hidden></button>
    </header>

    <div class="stage-wrap">
      <div class="stage controls-on" id="stage">
        <video id="video" playsinline preload="auto" crossorigin="anonymous"></video>

        <div class="subs" id="subs">
          <div class="ja" id="subJa" lang="ja"></div>
          <div class="en" id="subEn" lang="en"></div>
        </div>

        <div class="overlay" id="overlay">
          <div class="spinner" id="spin"></div>
          <div class="big" id="ovTitle">Preparing…</div>
          <div class="small" id="ovText" aria-live="polite"></div>
          <button class="play" id="ovPlay" hidden aria-label="Play">▶</button>
          <button class="retry" id="ovRetry" hidden>Retry</button>
          <details class="err" id="ovErr" hidden>
            <summary>Details</summary>
            <code id="ovErrText"></code>
          </details>
        </div>

        <div class="skip-hint back" id="skipBack"></div>
        <div class="skip-hint fwd" id="skipFwd"></div>

        <div class="controls" id="controls">
          <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0">
            <div class="track">
              <div id="dubbed"></div>
              <div class="played" id="played"></div>
            </div>
            <div class="knob" id="knob"></div>
          </div>
          <div class="row">
            <button class="icon" id="playBtn" aria-label="Play"></button>
            <div class="vol">
              <button class="icon" id="volBtn" aria-label="Mute"></button>
              <input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Volume" />
            </div>
            <span class="time" id="time">0:00 / 0:00</span>
            <span class="spacer"></span>
            <div class="toggles">
              <div class="pill" role="group" aria-label="Voice" title="Voice">
                <svg class="tag" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M9 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm7.76-9.64-1.68 1.69a3.4 3.4 0 0 1 0 3.89l1.68 1.69a5.3 5.3 0 0 0 0-7.27zM20.07 2l-1.63 1.63a8.1 8.1 0 0 1 0 10.74L20.07 16a10.2 10.2 0 0 0 0-14z"
                  />
                </svg>
                <button id="audJa" class="on" aria-pressed="true" aria-label="Japanese voice">日本語</button
                ><button id="audEn" aria-pressed="false" aria-label="English voice">EN</button>
              </div>
              <div class="pill" role="group" aria-label="Subtitles" title="Subtitles">
                <svg class="tag" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 5v4h5v-1.5H7.5v-1H11V10zm7 0v4h5v-1.5h-3.5v-1H18V10z"
                  />
                </svg>
                <button id="subBtnJa" class="on" aria-pressed="true" aria-label="Japanese subtitles">
                  JA</button
                ><button id="subBtnEn" aria-pressed="false" aria-label="English subtitles">EN</button>
              </div>
            </div>
            <button class="icon" id="setBtn" aria-label="Settings" aria-haspopup="true"></button>
            <button class="icon" id="fsBtn" aria-label="Fullscreen"></button>
          </div>
          <div class="menu" id="menu" hidden>
            <div class="menu-label">Speed</div>
            <div class="pill" id="rates" role="group" aria-label="Playback speed">
              <button data-v="0.5">0.5</button><button data-v="0.75">0.75</button
              ><button data-v="1">1×</button><button data-v="1.25">1.25</button
              ><button data-v="1.5">1.5</button>
            </div>
            <div class="menu-label">Subtitle size</div>
            <div class="pill" id="sizes" role="group" aria-label="Subtitle size">
              <button data-v="0.8">S</button><button data-v="1">M</button><button data-v="1.25">L</button
              ><button data-v="1.5">XL</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <section class="below">
      <div class="status" id="status"></div>
      <div class="actions"><button id="asbBtn" hidden>Send subtitles to asbplayer</button></div>
    </section>

    <script src="/static/common.js"></script>
    <script src="/static/player.js"></script>
  </body>
</html>
